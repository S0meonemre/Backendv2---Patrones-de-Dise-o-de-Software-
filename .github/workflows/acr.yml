name: Build and push to Azure Container Registry

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: backendjeremy
  BUILDKIT_PROGRESS: plain

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: true

      - name: Start diagnostic log
        run: |
          mkdir -p diagnostics
          {
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Runner: $RUNNER_OS"
            echo "Started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } | tee diagnostics/workflow.log

      - name: Enable step diagnostics
        run: echo "A partir de este paso, cada operación registrará su inicio, fin y duración."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        id: maven
        run: |
          set -o pipefail
          { echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Inicio: Maven clean package"; \
            mvn --batch-mode --no-transfer-progress --show-version clean package; \
            result=$?; echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Fin: Maven (código $result)"; exit "$result"; \
          } 2>&1 | tee diagnostics/maven.log

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Validate ACR secrets
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          missing=0
          for name in ACR_LOGIN_SERVER ACR_USERNAME ACR_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is empty or not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Log in to Azure Container Registry
        id: login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Record registry and image details
        run: |
          {
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Registro: ${ACR_LOGIN_SERVER:-NO_CONFIGURADO}"
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Imagen: ${IMAGE_NAME}"
          } | tee -a diagnostics/workflow.log

      - name: Define image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write final job status
        if: always()
        run: |
          result="${{ job.status }}"
          echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Job result: $result" | tee -a diagnostics/workflow.log
          {
            echo "## Diagnóstico ACR"
            echo "- Resultado del job: **$result**"
            echo "- Maven: **${{ steps.maven.outcome || 'no ejecutado' }}**"
            echo "- Buildx: **${{ steps.buildx.outcome || 'no ejecutado' }}**"
            echo "- Login ACR: **${{ steps.login.outcome || 'no ejecutado' }}**"
            echo "- Tags: **${{ steps.meta.outcome || 'no ejecutado' }}**"
            echo "- Build y push: **${{ steps.publish.outcome || 'no ejecutado' }}**"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Ejecución: [#$GITHUB_RUN_ID](../../actions/runs/$GITHUB_RUN_ID) (intento $GITHUB_RUN_ATTEMPT)"
            echo "- Revisa los registros de cada paso para localizar el primer error. El log Maven también se adjunta como artefacto."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acr-workflow-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
