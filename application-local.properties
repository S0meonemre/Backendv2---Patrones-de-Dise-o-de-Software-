# La conexion y las credenciales se configuran en .env, cargado por Spring Boot.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:serf}?protocolVersion=3}
spring.datasource.username=${DB_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
